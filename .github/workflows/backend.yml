name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      # Light deps only — CI has no Gemini key and no corpus, so the suite exercises
      # the classifier tree and the escalate-path contract shapes.
      - run: pip install fastapi pydantic pydantic-settings python-dotenv httpx pytest rank-bm25
      - run: pytest
